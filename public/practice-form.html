<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Local test form</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#171a1c;color:#e7ece9;font:14px/1.6 system-ui,sans-serif}main{max-width:620px;margin:auto}h1{font-size:23px;font-weight:600;margin:0 0 12px}p{color:#a5afa8;margin:0 0 24px}fieldset{border:1px solid #353d37;border-radius:6px;padding:20px;margin:25px 0}legend{padding:0 6px;font-size:14px}label{display:flex;gap:10px;padding:8px 0;align-items:center}input{accent-color:#36c785}button{border:0;border-radius:5px;padding:11px 18px;font:inherit;background:#36c785;color:#08170f;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #75dfaa;outline-offset:4px}[hidden]{display:none}
</style></head><body><main><h1>Local test form</h1><p>This checks real session monitoring. Test answers are not saved. Switch tabs, return, then check the facilitator dashboard.</p><form id="test-form"><fieldset><legend>Which structure controls what enters and leaves a cell?</legend><label><input type="radio" name="question" value="membrane" required>Cell membrane</label><label><input type="radio" name="question" value="nucleus">Nucleus</label><label><input type="radio" name="question" value="ribosome">Ribosome</label></fieldset><button type="submit">Submit test form</button></form><section id="confirmation" hidden role="status"><h2>Test form submitted</h2><p>Click Finish &amp; stop monitoring in the session when you are done.</p></section></main><script src="/practice-form.js"></script></body></html>
