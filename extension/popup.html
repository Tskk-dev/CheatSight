<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CheatSight monitoring</title><link rel="stylesheet" href="popup.css"></head><body><h1>CheatSight</h1><p id="status" role="status">Checking monitoring…</p><form id="connect"><label>Student session link<input id="link" type="url" required placeholder="https://your-site/join/…"></label><label>Your display name<input id="name" required maxlength="80" autocomplete="name"></label><label class="check"><input id="consent" type="checkbox" required><span>I understand that switching away from the assigned Meet tab/window is logged for my facilitator. No call contents or other tab URLs are sent.</span></label><button type="submit">Connect monitoring</button></form><section id="active" hidden><h2 id="title"></h2><p id="state"></p><button id="open">Open Google Meet</button><button id="finish" class="secondary">Finish &amp; stop monitoring</button></section><p id="error" role="alert"></p><p class="small">Only the specified Meet tab is monitored after you connect. Activity is browser-reported and does not prove attendance, attention, or cheating.</p><script type="module" src="popup.mjs"></script></body></html>
